<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Minecraft Interactive Map</title>
    <link rel="stylesheet" href="https://unpkg.com" />
    <style>
        html, body, #map {
            width: 100%;
            height: 100%;
            margin: 0;
            padding: 0;
            background-color: #111;
        }
    </style>
</head>
<body>

    <div id="map"></div>

    <script src="https://unpkg.com"></script>
    <script>
        // 1. Создаем карту с простой плоской системой координат
        const map = L.map('map', {
            crs: L.CRS.Simple,
            minZoom: -2,  // Позволяет отдалять карту сильнее
            maxZoom: 1,   // Максимальное приближение
            zoomSnap: 0.5 // Более плавное приближение в VS Code
        });

        // 2. Подключаем ваши тайлы 1024x1024
        const tileLayer = L.tileLayer('map/{z}/{x}_{y}.png', {
            tileSize: 1024, // Указываем точный размер ваших картинок
            noWrap: true,
            continuousWorld: true
        }).addTo(map);

        // 3. Центрируем карту (примерно на первый тайл)
        map.setView([-512, 512], -1);

        // Константа для перевода пикселей в блоки Minecraft 
        // (Поменяйте 1, если один пиксель картинки равен одному блоку в игре)
        const PIXELS_TO_BLOCKS = 1; 

        // 4. Показ координат Minecraft при клике
        const popup = L.popup();
        function onMapClick(e) {
            // В CRS.Simple координата Y идет снизу вверх, а в пикселях сверху вниз,
            // поэтому инвертируем Y для соответствия привычной сетке
            const mcX = Math.round(e.latlng.lng * PIXELS_TO_BLOCKS);
            const mcZ = Math.round(-e.latlng.lat * PIXELS_TO_BLOCKS);

            popup
                .setLatLng(e.latlng)
                .setContent(`<b>Координаты Minecraft:</b><br>X: ${mcX}<br>Z: ${mcZ}`)
                .openOn(map);
        }
        map.on('click', onMapClick);
    </script>
</body>
</html>
