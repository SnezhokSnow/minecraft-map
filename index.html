
<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#191c23">

  <title>Minecraft Interactive Map</title>

  <link
    rel="stylesheet"
    href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
  >

  <link rel="stylesheet" href="./style.css">
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <span class="brand-icon">M</span>
      <div>
        <h1>Mydei's Milk</h1>
        <p>Интерактивная карта майнкрафт</p>
      </div>
    </div>

    <div class="topbar-actions">
      <span id="tile-count">Загрузка карты...</span>
      <button id="fit-map" type="button">Показать всю карту</button>
    </div>
  </header>

  <main>
    <div id="map" aria-label="Интерактивная карта Minecraft"></div>

    <section class="coordinate-panel">
      <div>
        <span class="coordinate-label">X</span>
        <strong id="coord-x">—</strong>
      </div>

      <div>
        <span class="coordinate-label">Z</span>
        <strong id="coord-z">—</strong>
      </div>

      <span id="map-status" role="status">Подготовка карты...</span>
    </section>
  </main>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script type="module" src="./js/main.js"></script>
</body>
</html>
